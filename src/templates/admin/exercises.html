{% extends "admin/base.html" %}
{% block title %}Exercise Images{% endblock %}
{% block head %}
  <style>
    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    h1 { font-size: 17px; font-weight: 700; flex-shrink: 0; }
    .stats { font-size: 13px; color: var(--ink-2); flex-shrink: 0; }
    .search {
      flex: 1;
      min-width: 180px;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--ink);
      font-size: 14px;
      outline: none;
    }
    .search::placeholder { color: var(--muted); }
    .search:focus { border-color: var(--accent); }
    .filters { display: flex; gap: 6px; flex-shrink: 0; }
    .fbtn {
      padding: 7px 13px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--ink-2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.12s;
    }
    .fbtn.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 14px;
      padding: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .card.saved { border-color: var(--good); }
    .img-wrap {
      height: 170px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .no-img { color: var(--muted); font-size: 13px; }
    .img-err { color: var(--critical-ink); font-size: 13px; }
    .info { padding: 10px 13px 6px; }
    .name { font-size: 14px; font-weight: 700; line-height: 1.3; }
    .name-link { color: var(--ink); text-decoration: none; }
    .name-link:hover { color: var(--accent); text-decoration: underline; }
    .cand-link { font-size: 12px; font-weight: 600; color: var(--accent); text-decoration: none; white-space: nowrap; }
    .meta { font-size: 11px; color: var(--ink-2); margin-top: 3px; }
    .badge-custom {
      display: inline-block;
      font-size: 10px; font-weight: 700;
      color: var(--good-ink);
      background: rgba(12,163,12,0.12);
      padding: 2px 6px; border-radius: 4px;
      margin-top: 4px;
    }
    .url-input {
      margin: 8px 12px 0;
      background: var(--surface-2);
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      padding: 7px 10px;
      color: var(--ink);
      font-size: 12px;
      outline: none;
      width: calc(100% - 24px);
    }
    .url-input::placeholder { color: var(--muted); }
    .url-input:focus { border-color: var(--accent); }
    .btn-row {
      display: flex;
      gap: 7px;
      padding: 8px 12px 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-save {
      background: var(--accent); color: var(--accent-ink);
      border: none; border-radius: 7px;
      padding: 7px 15px; font-size: 12px; font-weight: 700;
      cursor: pointer;
    }
    .btn-save:hover { opacity: 0.85; }
    .btn-clear {
      background: transparent; color: var(--ink-2);
      border: 1px solid var(--border-strong); border-radius: 7px;
      padding: 7px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer;
    }
    .btn-clear:hover { border-color: var(--critical-ink); color: var(--critical-ink); }
    .btn-suggest {
      background: transparent; color: var(--accent);
      border: 1px solid var(--accent); border-radius: 7px;
      padding: 7px 12px; font-size: 12px; font-weight: 600;
      cursor: pointer; margin-left: auto;
    }
    .btn-suggest:hover { background: var(--accent-wash); }
    .btn-suggest:disabled { opacity: 0.5; cursor: default; }
    .status { font-size: 11px; }
    .status.ok  { color: var(--good-ink); }
    .status.err { color: var(--critical-ink); }
    .empty { text-align: center; padding: 80px 24px; color: var(--muted); grid-column: 1/-1; }

    /* GIF search panel */
    .backdrop {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,0.6);
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    .backdrop.open { display: flex; }
    .panel {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      width: min(1100px, 100%); height: min(860px, 100%);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-head {
      display: flex; gap: 14px; align-items: center;
      padding: 14px 18px; border-bottom: 1px solid var(--border);
    }
    .panel-head .current {
      width: 64px; height: 50px; border-radius: 6px; background: var(--surface-2);
      overflow: hidden; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: var(--muted);
    }
    .panel-head .current img { width: 100%; height: 100%; object-fit: cover; }
    .panel-head .title { font-size: 16px; font-weight: 700; }
    .panel-head .sub { font-size: 12px; color: var(--ink-2); margin-top: 2px; }
    .panel-close {
      margin-left: auto; background: transparent; border: 1px solid var(--border-strong); color: var(--ink-2);
      border-radius: 7px; padding: 6px 12px; font-size: 13px; cursor: pointer;
    }
    .panel-close:hover { color: var(--ink); }
    .catalog-bar {
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
      padding: 8px 18px; font-size: 12px; color: var(--ink-2); border-bottom: 1px solid var(--border);
    }
    .catalog-bar .warn { color: var(--warning-ink); }
    .btn-small {
      background: transparent; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px;
      padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
    }
    .btn-small:disabled { opacity: 0.5; cursor: default; }
    .search-row {
      display: flex; gap: 8px; flex-wrap: wrap; padding: 12px 18px; border-bottom: 1px solid var(--border);
    }
    .search-row .search { min-width: 220px; }
    .facet {
      background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 8px;
      color: var(--ink); font-size: 13px; padding: 7px 8px; max-width: 200px;
    }
    .panel-body { flex: 1; overflow-y: auto; padding: 14px 18px 18px; }
    .result-count { font-size: 12px; color: var(--ink-2); margin-bottom: 10px; }
    .section-label { font-size: 12px; font-weight: 700; color: var(--ink-2); margin: 18px 0 10px; }
    .gif-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .gif-tile {
      background: var(--surface-2); border: 2px solid transparent; border-radius: 10px;
      overflow: hidden; cursor: pointer; display: flex; flex-direction: column;
    }
    .gif-tile:hover { border-color: var(--accent); }
    .gif-tile.current { border-color: var(--good); }
    .gif-tile img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #fff; display: block; }
    .gif-tile .t-body { padding: 7px 8px 8px; }
    .gif-tile .t-name { font-size: 12px; line-height: 1.3; color: var(--ink-2); }
    .gif-tile .t-name b { color: var(--ink); }
    .gif-tile .t-meta { font-size: 10px; color: var(--ink-2); margin-top: 3px; }
    .gif-tile .t-used { font-size: 10px; color: var(--warning-ink); margin-top: 3px; }
    .gif-tile .t-current { font-size: 10px; color: var(--good-ink); margin-top: 3px; font-weight: 700; }
    .more-row { text-align: center; margin-top: 14px; }
    .preview {
      display: grid; grid-template-columns: minmax(240px, 360px) 1fr; gap: 20px; align-items: start;
    }
    .preview img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; background: #fff; border-radius: 10px; }
    .preview h2 { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
    .preview .p-meta { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
    .preview .p-desc { font-size: 13px; color: var(--ink-2); line-height: 1.5; margin: 12px 0; }
    .preview .p-used { font-size: 12px; color: var(--warning-ink); margin-bottom: 12px; }
    .preview .p-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .msg { font-size: 13px; color: var(--ink-2); padding: 30px 0; text-align: center; }
    .msg.err { color: var(--critical-ink); }
    @media (max-width: 700px) {
      .backdrop { padding: 0; }
      .panel { border-radius: 0; width: 100%; height: 100%; border: none; }
      .preview { grid-template-columns: 1fr; }
    }
  </style>
{% endblock %}
{% block content %}
  <div class="topbar">
    <h1>Exercise Images</h1>
    <span class="stats" id="stats">Loading…</span>
    <input class="search" type="text" placeholder="Search by name or equipment…" oninput="onSearch(this.value)">
    <a class="cand-link" href="{{ url_for('admin.admin_exercise_candidates') }}">Library candidates</a>
    <div class="filters">
      <button class="fbtn active" onclick="setFilter('all',this)">All</button>
      <button class="fbtn" onclick="setFilter('no_image',this)">No Image</button>
      <button class="fbtn" onclick="setFilter('has_image',this)">Has Image</button>
    </div>
  </div>
  <div class="grid" id="grid"></div>

  <div class="backdrop" id="gif-backdrop" onclick="if (event.target === this) closePanel()">
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <div class="panel-head">
        <div class="current" id="panel-current">No image</div>
        <div>
          <div class="title" id="panel-title"></div>
          <div class="sub" id="panel-sub"></div>
        </div>
        <button class="panel-close" onclick="closePanel()">Close</button>
      </div>
      <div class="catalog-bar" id="catalog-bar">Loading catalog…</div>
      <div class="search-row">
        <input class="search" type="text" id="gif-q" placeholder="Search the catalog, any word order…"
               oninput="queueSearch()" autocomplete="off">
        <select class="facet" id="f-equipment" onchange="runSearch()"></select>
        <select class="facet" id="f-body_part" onchange="runSearch()"></select>
        <select class="facet" id="f-target" onchange="runSearch()"></select>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>
{% endblock %}
{% block scripts %}
  <script>
    const EQUIPMENT_MAP = {{ equipment_map | tojson }};
    let exercises = [];
    let filter = 'all';
    let search = '';

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    async function init() {
      const res = await fetch('/admin/exercises/data');
      exercises = await res.json();
      render();
    }

    function setFilter(f, btn) {
      filter = f;
      document.querySelectorAll('.fbtn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function onSearch(val) { search = val.toLowerCase(); render(); }

    function visible(ex) {
      const match = ex.name.toLowerCase().includes(search) || ex.equipment.toLowerCase().includes(search);
      if (filter === 'no_image')  return match && !ex.image_url;
      if (filter === 'has_image') return match && !!ex.image_url;
      return match;
    }

    function render() {
      const list = exercises.filter(visible);
      const noImg = exercises.filter(e => !e.image_url).length;
      document.getElementById('stats').textContent =
        exercises.length + ' exercises · ' + noImg + ' without image · showing ' + list.length;

      document.getElementById('grid').innerHTML = list.length
        ? list.map(cardHtml).join('')
        : '<div class="empty">No exercises match.</div>';
    }

    function cardHtml(ex) {
      const url = esc(ex.image_url || '');
      const imgHtml = ex.image_url
        ? `<img src="${url}" onerror="imgErr(${ex.id})">`
        : `<div class="no-img">No image</div>`;
      const meta = [ex.equipment, ex.muscle_group].filter(Boolean).join(' · ');
      return `
        <div class="card" id="card-${ex.id}">
          <div class="img-wrap" id="wrap-${ex.id}">${imgHtml}</div>
          <div class="info">
            <div class="name"><a class="name-link" href="/admin/exercises/${ex.id}">${esc(ex.name)}</a></div>
            <div class="meta">${esc(meta) || '—'}</div>
            ${ex.is_custom ? '<span class="badge-custom">Custom</span>' : ''}
          </div>
          <input class="url-input" type="url" id="input-${ex.id}"
                 placeholder="Paste image URL to preview…"
                 value="${url}"
                 oninput="previewUrl(${ex.id}, this.value)">
          <div class="btn-row">
            <button class="btn-save" onclick="save(${ex.id})">Save</button>
            <button class="btn-clear" onclick="doClear(${ex.id})">Clear</button>
            <span class="status" id="status-${ex.id}"></span>
            <button class="btn-suggest" onclick="openPanel(${ex.id})">Find GIF</button>
          </div>
        </div>`;
    }

    function previewUrl(id, url) {
      const wrap = document.getElementById('wrap-' + id);
      if (!wrap) return;
      if (!url.trim()) {
        wrap.innerHTML = '<div class="no-img">No image</div>';
        return;
      }
      const safe = url.replace(/"/g, '');
      wrap.innerHTML = `<img src="${safe}" onerror="imgErr(${id})">`;
    }

    function imgErr(id) {
      const wrap = document.getElementById('wrap-' + id);
      if (wrap) wrap.innerHTML = '<div class="img-err">⚠ Could not load image</div>';
    }

    function doClear(id) {
      const input = document.getElementById('input-' + id);
      if (input) input.value = '';
      previewUrl(id, '');
    }

    function flashSaved(id) {
      const card = document.getElementById('card-' + id);
      if (card) { card.classList.add('saved'); setTimeout(() => card.classList.remove('saved'), 1500); }
      const status = document.getElementById('status-' + id);
      if (status) {
        status.textContent = '✓ Saved';
        status.className = 'status ok';
        setTimeout(() => { status.textContent = ''; }, 2500);
      }
    }

    async function save(id) {
      const input = document.getElementById('input-' + id);
      const status = document.getElementById('status-' + id);
      const url = (input?.value || '').trim();
      try {
        const res = await fetch('/admin/exercises/' + id + '/image', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image_url: url || null }),
        });
        if (res.ok) {
          const ex = exercises.find(e => e.id === id);
          if (ex && ex.image_url !== url) { ex.image_url = url; ex.image_source_id = null; }
          flashSaved(id);
        } else {
          status.textContent = '✗ Error';
          status.className = 'status err';
        }
      } catch {
        status.textContent = '✗ Network error';
        status.className = 'status err';
      }
    }

    // ── GIF search panel ──────────────────────────────────────
    // Searches our copy of ExerciseDB's catalog (no API call). Only thumbnails
    // not seen before, the catalog fetch, and the final save use the quota.

    let panelEx = null;
    let catalog = null;
    let results = [];
    let nextOffset = null;
    let searchTimer = null;
    let searchSeq = 0;

    function openPanel(id) {
      panelEx = exercises.find(e => e.id === id);
      if (!panelEx) return;
      document.getElementById('panel-title').textContent = panelEx.name;
      document.getElementById('panel-sub').textContent =
        [panelEx.equipment, panelEx.muscle_group].filter(Boolean).join(' · ');
      const cur = document.getElementById('panel-current');
      cur.innerHTML = panelEx.image_url ? `<img src="${esc(panelEx.image_url)}" alt="">` : 'No image';
      document.getElementById('gif-q').value = panelEx.name;
      document.getElementById('gif-backdrop').classList.add('open');
      document.body.style.overflow = 'hidden';
      loadCatalog(true);
      document.getElementById('gif-q').focus();
    }

    function closePanel() {
      document.getElementById('gif-backdrop').classList.remove('open');
      document.body.style.overflow = '';
      panelEx = null;
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape' && panelEx) closePanel();
    });

    function quotaText(q) {
      if (!q || q.remaining == null) return 'API calls left this month: unknown until the next call';
      return 'API calls left this month: ' + q.remaining + (q.limit ? ' of ' + q.limit : '');
    }

    async function loadCatalog(thenSearch) {
      try {
        const res = await fetch('/admin/exercises/catalog');
        catalog = await res.json();
      } catch {
        document.getElementById('catalog-bar').innerHTML = '<span class="warn">Could not load the catalog.</span>';
        return;
      }
      renderCatalogBar();
      fillFacets(thenSearch);
      if (thenSearch) runSearch();
    }

    function renderCatalogBar(progress) {
      const bar = document.getElementById('catalog-bar');
      const c = catalog;
      if (progress) {
        bar.innerHTML = `<span>Fetching catalog… ${progress.count} exercises so far.</span>
          <span>${esc(quotaText(progress.quota))}</span>`;
        return;
      }
      const fetchLabel = !c.count ? 'Fetch catalog' : c.complete ? 'Refresh catalog' : 'Continue fetch';
      const note = !c.count
        ? '<span class="warn">The catalog hasn&#39;t been fetched yet. Search needs it.</span>'
        : c.complete
          ? `Catalog: ${c.count} exercises, fetched ${esc(c.fetched_at || '')}.`
          : `<span class="warn">Catalog stopped partway at ${c.count} exercises.</span>`;
      bar.innerHTML = `<span>${note}</span><span>${esc(quotaText(c.quota))}</span>
        ${c.api_key_set
          ? `<button class="btn-small" onclick="fetchCatalog()">${fetchLabel}</button>`
          : '<span class="warn">RAPIDAPI_KEY is not set on the server.</span>'}`;
    }

    function fillFacets(preselect) {
      const labels = { equipment: 'Any equipment', body_part: 'Any body part', target: 'Any target muscle' };
      for (const field of ['equipment', 'body_part', 'target']) {
        const sel = document.getElementById('f-' + field);
        const keep = preselect ? null : sel.value;
        const values = (catalog && catalog.facets[field]) || [];
        sel.innerHTML = `<option value="">${labels[field]}</option>` +
          values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
        if (keep && values.includes(keep)) sel.value = keep;
      }
      if (preselect && panelEx) {
        const mapped = EQUIPMENT_MAP[panelEx.equipment];
        const sel = document.getElementById('f-equipment');
        if (mapped && [...sel.options].some(o => o.value === mapped)) sel.value = mapped;
      }
    }

    async function fetchCatalog() {
      // Rows arrive in catalog order, so a copy that stopped partway carries on from its row count
      let offset = catalog.count && !catalog.complete ? catalog.count : 0;
      const what = offset
        ? `Carries on from exercise ${offset}, at 10 exercises per API call.`
        : catalog.count
          ? 'Refreshing re-reads the whole catalog: about 135 API calls (10 exercises per call).'
          : 'Fetching the catalog uses about 135 API calls (10 exercises per call).';
      if (!confirm(what + '\n\n' + quotaText(catalog.quota) + '\n\nIf it stops partway, what was fetched is kept.')) return;
      renderCatalogBar({ count: catalog.count, quota: catalog.quota });
      while (true) {
        let res, data;
        try {
          res = await fetch('/admin/exercises/catalog/fetch', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ offset }),
          });
          data = await res.json();
        } catch {
          data = { message: 'Network error.' };
        }
        if (data.count != null) catalog = data;
        if (!res || !res.ok) {
          renderCatalogBar();
          document.getElementById('catalog-bar').insertAdjacentHTML('beforeend',
            `<span class="warn">Stopped at ${offset}: ${esc(data.message || 'error')}</span>`);
          break;
        }
        offset = data.next_offset;
        if (data.done) { renderCatalogBar(); break; }
        renderCatalogBar({ count: data.count, quota: data.quota });
      }
      fillFacets(false);
      runSearch();
    }

    function queueSearch() {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(runSearch, 220);
    }

    function searchParams(offset) {
      const p = new URLSearchParams({
        q: document.getElementById('gif-q').value,
        exercise_id: panelEx ? panelEx.id : '',
        offset: offset || 0,
      });
      for (const f of ['equipment', 'body_part', 'target']) {
        const v = document.getElementById('f-' + f).value;
        if (v) p.set(f, v);
      }
      return p;
    }

    async function runSearch(append) {
      if (!panelEx) return;
      const body = document.getElementById('panel-body');
      if (!catalog || !catalog.count) {
        body.innerHTML = '<div class="msg">Fetch the catalog to search it.</div>';
        return;
      }
      const seq = ++searchSeq;
      let data;
      try {
        const res = await fetch('/admin/exercises/catalog/search?' + searchParams(append ? nextOffset : 0));
        data = await res.json();
        if (!res.ok) throw new Error(data.message);
      } catch (e) {
        if (seq === searchSeq) body.innerHTML = `<div class="msg err">${esc(e.message || 'Search failed.')}</div>`;
        return;
      }
      if (seq !== searchSeq) return;
      results = append ? results.concat(data.results) : data.results;
      nextOffset = data.next_offset;
      if (!append) lastSearch = data;
      renderResults();
    }

    let lastSearch = null;

    function tileHtml(r) {
      const name = r.name_parts.map(([w, bold]) => bold ? `<b>${esc(w)}</b>` : esc(w)).join(' ');
      const isCurrent = panelEx && panelEx.image_source_id === r.id;
      return `<div class="gif-tile${isCurrent ? ' current' : ''}" onclick="showPreview('${esc(r.id)}')">
        <img src="${esc(r.thumb_url)}" loading="lazy" alt="">
        <div class="t-body">
          <div class="t-name">${name}</div>
          <div class="t-meta">${esc(r.equipment)} · ${esc(r.target)}</div>
          ${isCurrent ? '<div class="t-current">Current image</div>' : ''}
          ${r.used_by.length ? `<div class="t-used">Used by ${esc(r.used_by.join(', '))}</div>` : ''}
        </div>
      </div>`;
    }

    function renderResults() {
      const body = document.getElementById('panel-body');
      const d = lastSearch;
      let html = `<div class="result-count">${d.total} match${d.total === 1 ? '' : 'es'}` +
        (d.total ? `, showing ${results.length}` : '') + '</div>';
      if (results.length) html += `<div class="gif-tiles">${results.map(tileHtml).join('')}</div>`;
      if (nextOffset != null) {
        html += `<div class="more-row"><button class="btn-small" onclick="runSearch(true)">Show more</button></div>`;
      }
      if (d.close.length) {
        html += `<div class="section-label">Close matches (one word missing)</div>
          <div class="gif-tiles">${d.close.map(tileHtml).join('')}</div>`;
      }
      if (!results.length && !d.close.length) {
        html += '<div class="msg">Nothing matches. Try fewer words, or set a filter back to Any.</div>';
      }
      body.innerHTML = html;
    }

    function findResult(id) {
      return results.find(r => r.id === id) || (lastSearch && lastSearch.close.find(r => r.id === id));
    }

    function showPreview(id) {
      const r = findResult(id);
      if (!r) return;
      const body = document.getElementById('panel-body');
      const secondary = r.secondary_muscles.length ? ' · also ' + r.secondary_muscles.join(', ') : '';
      body.innerHTML = `<div class="preview">
        <img src="${esc(r.thumb_url)}" alt="">
        <div>
          <h2>${esc(r.name)}</h2>
          <div class="p-meta">${esc(r.equipment)} · ${esc(r.body_part)}</div>
          <div class="p-meta">Target: ${esc(r.target)}${esc(secondary)}</div>
          ${r.description ? `<div class="p-desc">${esc(r.description)}</div>` : ''}
          ${r.used_by.length ? `<div class="p-used">Already used by ${esc(r.used_by.join(', '))}</div>` : ''}
          <div class="p-actions">
            <button class="btn-save" id="use-btn" onclick="useGif('${esc(r.id)}')">Use this GIF</button>
            <button class="btn-clear" onclick="renderResults()">Back to results</button>
            <span class="status" id="use-status"></span>
          </div>
        </div>
      </div>`;
    }

    async function useGif(exercisedbId) {
      const id = panelEx.id;
      const btn = document.getElementById('use-btn');
      const status = document.getElementById('use-status');
      btn.disabled = true;
      status.textContent = 'Saving…';
      status.className = 'status';
      try {
        const res = await fetch('/admin/exercises/' + id + '/apply-suggestion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ exercisedb_id: exercisedbId }),
        });
        const data = await res.json();
        if (!res.ok) {
          status.textContent = data.message || 'Error saving image.';
          status.className = 'status err';
          btn.disabled = false;
          return;
        }
        // Same file path as before, so bust the browser's copy of the old GIF
        const fresh = data.image_url + '?v=' + Date.now();
        const ex = exercises.find(e => e.id === id);
        if (ex) { ex.image_url = data.image_url; ex.image_source_id = data.image_source_id; }
        const input = document.getElementById('input-' + id);
        if (input) input.value = data.image_url;
        previewUrl(id, fresh);
        closePanel();
        flashSaved(id);
      } catch {
        status.textContent = 'Network error.';
        status.className = 'status err';
        btn.disabled = false;
      }
    }

    init();
  </script>
{% endblock %}

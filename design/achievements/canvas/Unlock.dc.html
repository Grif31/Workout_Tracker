<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Achievement unlocked</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bs{stroke-width:3;stroke-linejoin:round}
.bo{fill:none;stroke-width:1.2;opacity:.55}
.bi{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bt{font:800 9px Inter,sans-serif;text-anchor:middle}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #141416; color: #FFFFFF; font-family: Inter, -apple-system, sans-serif; position: relative; overflow: hidden;">
  <div style="padding: 70px 16px 0; display: flex; flex-direction: column; gap: 14px;">
    <div style="font-size: 26px; font-weight: 800;">Workout complete</div>
    <div style="font-size: 14px; color: #8E8E93;">Push Day · 58 min</div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">
      <div style="background: #1C1C1E; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #8E8E93;">Volume</span><span style="font-size: 18px; font-weight: 700;">14,820</span></div>
      <div style="background: #1C1C1E; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #8E8E93;">Sets</span><span style="font-size: 18px; font-weight: 700;">21</span></div>
      <div style="background: #1C1C1E; border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 4px;"><span style="font-size: 12px; color: #8E8E93;">PRs</span><span style="font-size: 18px; font-weight: 700;">2</span></div>
    </div>
  </div>

  <div style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6);"></div>

  <div role="dialog" aria-label="Achievement unlocked" style="position: absolute; left: 0; right: 0; bottom: 0; background: #1C1C1E; border-radius: 24px 24px 0 0; padding: 12px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 14px;">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: #48484A;"></div>
    <div style="font-size: 13px; font-weight: 700; letter-spacing: 1.5px; color: {{gold}};">ACHIEVEMENT UNLOCKED</div>
    <div style="width: 180px; height: 180px; border-radius: 90px; background: radial-gradient(circle, {{glow}} 0%, rgba(0,0,0,0) 70%); display: flex; align-items: center; justify-content: center;">
      <svg viewBox="-8 -8 80 80" width="150" height="150" role="img" aria-label="Hekaton badge, gold"><path class="bs" d="M32 4 A28 28 0 1 1 31.99 4 Z" fill="#3A3015" stroke="#E8C25A"></path><path d="M32 4 A28 28 0 1 1 31.99 4 Z" fill="none" stroke="#E8C25A" transform="translate(5.12 5.12) scale(0.84)" style="stroke-width: 3; stroke-dasharray: 3 1.5;"></path><g transform="translate(20.00 15.50) scale(1.000)"><path class="bi" d="M3 4.5h18M5 4.5a1.6 1.6 0 1 0 1.6 1.6M19 4.5a1.6 1.6 0 1 1-1.6 1.6M6 7.5h12M7.5 7.5v10.5M10.5 7.5v10.5M13.5 7.5v10.5M16.5 7.5v10.5M5.5 18h13M4 20.5h16" stroke="#F6DE8E"></path></g><text class="bt" x="32" y="52" fill="#F6DE8E">100</text></svg>
    </div>
    <div style="font-size: 26px; font-weight: 800;">Hekaton</div>
    <div style="font-size: 15px; color: #8E8E93; text-align: center; max-width: 280px; line-height: 1.4;">Your 100th workout logged. Next: Phalanx, at 250.</div>
    <div style="display: flex; gap: 10px; align-self: stretch; margin-top: 6px;">
      <button style="flex: 1; appearance: none; border: 1px solid #38383A; background: #2C2C2E; color: #FFFFFF; border-radius: 14px; padding: 15px; font: 600 16px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px;">
        <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 8l5-5 5 5M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        Share
      </button>
      <button style="flex: 1; appearance: none; border: 0; background: {{accent}}; color: #000000; border-radius: 14px; padding: 15px; font: 700 16px Inter, sans-serif;">Continue</button>
    </div>
    <div style="font-size: 13px; color: #8E8E93;">+1 more unlocked: Half Million</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#30D158","options":["#30D158","#0A84FF","#BF5AF2","#FF9F0A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#30D158', gold: '#E8C25A', glow: 'rgba(232,194,90,0.28)' };
  }
}
</script>
</body>
</html>

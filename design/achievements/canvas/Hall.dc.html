<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trophy Hall</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bs{stroke-width:3;stroke-linejoin:round}
.bx{fill:none;stroke-width:2.4;stroke-linecap:round}
.bi{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bt{font:800 9px Inter,sans-serif;text-anchor:middle}
.bg{font:800 15px Inter,sans-serif;text-anchor:middle}
.bl{font:800 5.4px Inter,sans-serif;text-anchor:middle;letter-spacing:.8px}
.bh{font:800 9px Inter,sans-serif;text-anchor:middle}
.plain{appearance:none;background:none;border:0;padding:0;margin:0;font:inherit;color:inherit;cursor:pointer;text-align:left}
</style>
</helmet>
<div style="width: 390px; height: 1830px; box-sizing: border-box; background: #141416; color: #FFFFFF; font-family: Inter, -apple-system, sans-serif; display: flex; flex-direction: column;">
  <svg width="0" height="0" aria-hidden="true" style="position: absolute;"><defs>
    <radialGradient id="m-bronze" cx="0.38" cy="0.3" r="0.85"><stop offset="0" style="stop-color: #7A5134;"></stop><stop offset="0.55" style="stop-color: #3A2618;"></stop><stop offset="1" style="stop-color: #1E130B;"></stop></radialGradient>
    <linearGradient id="r-bronze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #F3C9A0;"></stop><stop offset="0.45" style="stop-color: #C98A5A;"></stop><stop offset="0.78" style="stop-color: #7A4626;"></stop><stop offset="1" style="stop-color: #C98A5A;"></stop></linearGradient>
    <linearGradient id="i-bronze" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="60"><stop offset="0" style="stop-color: #F3C9A0;"></stop><stop offset="1" style="stop-color: #C98A5A;"></stop></linearGradient>
    <linearGradient id="j-bronze" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" style="stop-color: #F3C9A0;"></stop><stop offset="1" style="stop-color: #C98A5A;"></stop></linearGradient>
    <radialGradient id="m-silver" cx="0.38" cy="0.3" r="0.85"><stop offset="0" style="stop-color: #59616D;"></stop><stop offset="0.55" style="stop-color: #2A2E35;"></stop><stop offset="1" style="stop-color: #15171B;"></stop></radialGradient>
    <linearGradient id="r-silver" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #FFFFFF;"></stop><stop offset="0.45" style="stop-color: #C7CDD6;"></stop><stop offset="0.78" style="stop-color: #6F7782;"></stop><stop offset="1" style="stop-color: #C7CDD6;"></stop></linearGradient>
    <linearGradient id="i-silver" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="60"><stop offset="0" style="stop-color: #FFFFFF;"></stop><stop offset="1" style="stop-color: #C7CDD6;"></stop></linearGradient>
    <linearGradient id="j-silver" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" style="stop-color: #FFFFFF;"></stop><stop offset="1" style="stop-color: #C7CDD6;"></stop></linearGradient>
    <radialGradient id="m-gold" cx="0.38" cy="0.3" r="0.85"><stop offset="0" style="stop-color: #7C6628;"></stop><stop offset="0.55" style="stop-color: #3A3015;"></stop><stop offset="1" style="stop-color: #1E180A;"></stop></radialGradient>
    <linearGradient id="r-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #FFF0B3;"></stop><stop offset="0.45" style="stop-color: #E8C25A;"></stop><stop offset="0.78" style="stop-color: #8F6B14;"></stop><stop offset="1" style="stop-color: #E8C25A;"></stop></linearGradient>
    <linearGradient id="i-gold" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="60"><stop offset="0" style="stop-color: #FFF0B3;"></stop><stop offset="1" style="stop-color: #E8C25A;"></stop></linearGradient>
    <linearGradient id="j-gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" style="stop-color: #FFF0B3;"></stop><stop offset="1" style="stop-color: #E8C25A;"></stop></linearGradient>
    <radialGradient id="m-marble" cx="0.38" cy="0.3" r="0.85"><stop offset="0" style="stop-color: #8A836F;"></stop><stop offset="0.55" style="stop-color: #4A4436;"></stop><stop offset="1" style="stop-color: #2A2620;"></stop></radialGradient>
    <linearGradient id="r-marble" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #FFFFFF;"></stop><stop offset="0.45" style="stop-color: #F2EEE4;"></stop><stop offset="0.78" style="stop-color: #A8A08E;"></stop><stop offset="1" style="stop-color: #F2EEE4;"></stop></linearGradient>
    <linearGradient id="i-marble" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="60"><stop offset="0" style="stop-color: #FFFFFF;"></stop><stop offset="1" style="stop-color: #F2EEE4;"></stop></linearGradient>
    <linearGradient id="j-marble" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" style="stop-color: #FFFFFF;"></stop><stop offset="1" style="stop-color: #F2EEE4;"></stop></linearGradient>
    <radialGradient id="m-locked" cx="0.38" cy="0.3" r="0.85"><stop offset="0" style="stop-color: #34343A;"></stop><stop offset="0.55" style="stop-color: #232325;"></stop><stop offset="1" style="stop-color: #18181A;"></stop></radialGradient>
    <linearGradient id="r-locked" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color: #9A9AA0;"></stop><stop offset="0.45" style="stop-color: #5A5A5E;"></stop><stop offset="0.78" style="stop-color: #3A3A3C;"></stop><stop offset="1" style="stop-color: #5A5A5E;"></stop></linearGradient>
    <linearGradient id="i-locked" gradientUnits="userSpaceOnUse" x1="0" y1="4" x2="0" y2="60"><stop offset="0" style="stop-color: #9A9AA0;"></stop><stop offset="1" style="stop-color: #5A5A5E;"></stop></linearGradient>
    <linearGradient id="j-locked" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="24"><stop offset="0" style="stop-color: #9A9AA0;"></stop><stop offset="1" style="stop-color: #5A5A5E;"></stop></linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color: #FFFFFF; stop-opacity: 0.16;"></stop><stop offset="0.5" style="stop-color: #FFFFFF; stop-opacity: 0;"></stop></linearGradient>
    <linearGradient id="spec" x1="0" y1="0" x2="1" y2="1"><stop offset="0.36" style="stop-color: #FFFFFF; stop-opacity: 0;"></stop><stop offset="0.44" style="stop-color: #FFFFFF; stop-opacity: 0.13;"></stop><stop offset="0.5" style="stop-color: #FFFFFF; stop-opacity: 0;"></stop></linearGradient>
  </defs></svg>
  <div style="height: 54px;"></div>
  <div style="display: flex; align-items: center; gap: 12px; padding: 8px 16px 12px;">
    <button aria-label="Go back" style="appearance: none; background: none; border: 0; padding: 10px; margin: -10px; color: #FFFFFF; display: flex;">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" style="stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 20px; font-weight: 700; flex: 1;">Trophy Hall</h1>
    <span style="font-size: 14px; color: #8E8E93;">30 of 70 earned</span>
  </div>

  <section style="margin: 4px 16px 0; border-radius: 20px; background: #1C1C1E; padding: 20px 12px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
    <div style="display: flex; align-items: flex-end; justify-content: center; gap: 10px;">
      <sc-for list="{{showcase}}" as="b" hint-placeholder-count="3">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; width: 112px;">
          <svg viewBox="-8 -8 80 80" width="{{b.size}}" height="{{b.size}}" role="img" aria-label="{{b.title}}"><path d="{{b.crown}}" fill="#A3B18A"></path><path d="{{b.shape}}" fill="rgba(0,0,0,0.45)" transform="translate(0.8 1.6)"></path><path d="{{b.shape}}" fill="none" stroke="rgba(0,0,0,0.55)" style="stroke-width: 4.4; stroke-linejoin: round;"></path><path class="bs" d="{{b.shape}}" fill="{{b.fillUrl}}" stroke="{{b.rimUrl}}"></path><path d="{{b.shape}}" fill="url(#spec)"></path><path d="{{b.shape}}" fill="url(#gloss)"></path><path d="{{b.veins}}" fill="none" stroke="#A39D8E" style="stroke-width: 0.6; opacity: 0.6;"></path><path d="{{b.band}}" fill="none" stroke="{{b.rimUrl}}" style="stroke-width: {{b.bandW}}; stroke-dasharray: {{b.bandDash}};"></path><path class="bx" d="{{b.extra}}" stroke="{{b.rimUrl}}"></path><path d="{{b.detail}}" fill="none" stroke="rgba(0,0,0,0.5)" transform="translate(0.35 0.45)" style="stroke-width: 0.85; stroke-linecap: round;"></path><path d="{{b.detail}}" fill="none" stroke="{{b.inkUrl}}" style="stroke-width: 0.85; stroke-linecap: round; opacity: 0.8;"></path><g transform="{{b.iconT}}"><path class="bi" d="{{b.icon}}" stroke="rgba(0,0,0,0.55)" transform="translate(0.6 0.8)"></path><path class="bi" d="{{b.icon}}" stroke="rgba(255,255,255,0.3)" transform="translate(-0.4 -0.5)"></path><path class="bi" d="{{b.icon}}" stroke="{{b.iconUrl}}"></path></g><path d="{{b.art}}" fill="rgba(0,0,0,0.5)" transform="translate(0.5 0.6)"></path><path d="{{b.art}}" fill="{{b.inkUrl}}"></path><text class="bh" x="32" y="36" fill="{{b.inkUrl}}">{{b.hid}}</text><text class="bl" x="32" y="23.5" fill="{{b.inkUrl}}">{{b.lbl}}</text><text class="bg" x="32" y="34" fill="{{b.inkUrl}}">{{b.glyph}}</text><text class="bt" x="32.4" y="{{b.stampY}}" fill="rgba(0,0,0,0.55)" transform="translate(0 0.6)">{{b.short}}</text><text class="bt" x="32" y="{{b.stampY}}" fill="{{b.inkUrl}}">{{b.short}}</text></svg>
          <div style="font-size: 13px; font-weight: 700; text-align: center;">{{b.title}}</div>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; align-self: stretch; border-top: 1px solid #38383A; padding: 10px 4px 0;">
      <span style="font-size: 13px; color: #8E8E93;">Pinned to your profile</span>
      <button style="appearance: none; background: none; border: 0; padding: 10px 0; font: 600 14px Inter, sans-serif; color: {{accent}};">Change</button>
    </div>
  </section>

  <h2 style="margin: 24px 16px 10px; font-size: 17px; font-weight: 700;">Almost there</h2>
  <div style="display: flex; flex-shrink: 0; gap: 12px; padding: 0 16px; overflow: hidden;">
    <sc-for list="{{close}}" as="c" hint-placeholder-count="3">
      <button class="plain" aria-label="{{c.label}}" style="flex: 0 0 148px; background: #1C1C1E; border-radius: 16px; padding: 14px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="position: relative; width: 96px; height: 96px;">
          <svg viewBox="0 0 84 84" width="96" height="96" aria-hidden="true" style="position: absolute; left: 0; top: 0;">
            <circle cx="42" cy="42" r="39" fill="none" stroke="#38383A" style="stroke-width: 3.5;"></circle>
            <circle cx="42" cy="42" r="39" fill="none" stroke="{{accent}}" transform="rotate(-90 42 42)" style="stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: {{c.dash}};"></circle>
          </svg>
          <div style="position: absolute; left: 13px; top: 13px;"><svg viewBox="-8 -8 80 80" width="70" height="70" aria-hidden="true"><path d="{{c.b.crown}}" fill="#A3B18A"></path><path d="{{c.b.shape}}" fill="rgba(0,0,0,0.45)" transform="translate(0.8 1.6)"></path><path d="{{c.b.shape}}" fill="none" stroke="rgba(0,0,0,0.55)" style="stroke-width: 4.4; stroke-linejoin: round;"></path><path class="bs" d="{{c.b.shape}}" fill="{{c.b.fillUrl}}" stroke="{{c.b.rimUrl}}"></path><path d="{{c.b.shape}}" fill="url(#spec)"></path><path d="{{c.b.shape}}" fill="url(#gloss)"></path><path d="{{c.b.veins}}" fill="none" stroke="#A39D8E" style="stroke-width: 0.6; opacity: 0.6;"></path><path d="{{c.b.band}}" fill="none" stroke="{{c.b.rimUrl}}" style="stroke-width: {{c.b.bandW}}; stroke-dasharray: {{c.b.bandDash}};"></path><path class="bx" d="{{c.b.extra}}" stroke="{{c.b.rimUrl}}"></path><path d="{{c.b.detail}}" fill="none" stroke="rgba(0,0,0,0.5)" transform="translate(0.35 0.45)" style="stroke-width: 0.85; stroke-linecap: round;"></path><path d="{{c.b.detail}}" fill="none" stroke="{{c.b.inkUrl}}" style="stroke-width: 0.85; stroke-linecap: round; opacity: 0.8;"></path><g transform="{{c.b.iconT}}"><path class="bi" d="{{c.b.icon}}" stroke="rgba(0,0,0,0.55)" transform="translate(0.6 0.8)"></path><path class="bi" d="{{c.b.icon}}" stroke="rgba(255,255,255,0.3)" transform="translate(-0.4 -0.5)"></path><path class="bi" d="{{c.b.icon}}" stroke="{{c.b.iconUrl}}"></path></g><path d="{{c.b.art}}" fill="rgba(0,0,0,0.5)" transform="translate(0.5 0.6)"></path><path d="{{c.b.art}}" fill="{{c.b.inkUrl}}"></path><text class="bh" x="32" y="36" fill="{{c.b.inkUrl}}">{{c.b.hid}}</text><text class="bl" x="32" y="23.5" fill="{{c.b.inkUrl}}">{{c.b.lbl}}</text><text class="bg" x="32" y="34" fill="{{c.b.inkUrl}}">{{c.b.glyph}}</text><text class="bt" x="32.4" y="{{c.b.stampY}}" fill="rgba(0,0,0,0.55)" transform="translate(0 0.6)">{{c.b.short}}</text><text class="bt" x="32" y="{{c.b.stampY}}" fill="{{c.b.inkUrl}}">{{c.b.short}}</text></svg></div>
        </div>
        <div style="font-size: 14px; font-weight: 700; text-align: center;">{{c.name}}</div>
        <div style="font-size: 12px; color: #8E8E93; text-align: center;">{{c.toGo}}</div>
      </button>
    </sc-for>
  </div>

  <h2 style="margin: 26px 16px 12px; font-size: 17px; font-weight: 700;">Milestones</h2>
  <div style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 6px;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="8">
      <button class="plain" aria-label="{{t.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-align: center; min-height: 44px;">
        <svg viewBox="-8 -8 80 80" width="100" height="100" aria-hidden="true"><path d="{{t.b.crown}}" fill="#A3B18A"></path><path d="{{t.b.shape}}" fill="rgba(0,0,0,0.45)" transform="translate(0.8 1.6)"></path><path d="{{t.b.shape}}" fill="none" stroke="rgba(0,0,0,0.55)" style="stroke-width: 4.4; stroke-linejoin: round;"></path><path class="bs" d="{{t.b.shape}}" fill="{{t.b.fillUrl}}" stroke="{{t.b.rimUrl}}"></path><path d="{{t.b.shape}}" fill="url(#spec)"></path><path d="{{t.b.shape}}" fill="url(#gloss)"></path><path d="{{t.b.veins}}" fill="none" stroke="#A39D8E" style="stroke-width: 0.6; opacity: 0.6;"></path><path d="{{t.b.band}}" fill="none" stroke="{{t.b.rimUrl}}" style="stroke-width: {{t.b.bandW}}; stroke-dasharray: {{t.b.bandDash}};"></path><path class="bx" d="{{t.b.extra}}" stroke="{{t.b.rimUrl}}"></path><path d="{{t.b.detail}}" fill="none" stroke="rgba(0,0,0,0.5)" transform="translate(0.35 0.45)" style="stroke-width: 0.85; stroke-linecap: round;"></path><path d="{{t.b.detail}}" fill="none" stroke="{{t.b.inkUrl}}" style="stroke-width: 0.85; stroke-linecap: round; opacity: 0.8;"></path><g transform="{{t.b.iconT}}"><path class="bi" d="{{t.b.icon}}" stroke="rgba(0,0,0,0.55)" transform="translate(0.6 0.8)"></path><path class="bi" d="{{t.b.icon}}" stroke="rgba(255,255,255,0.3)" transform="translate(-0.4 -0.5)"></path><path class="bi" d="{{t.b.icon}}" stroke="{{t.b.iconUrl}}"></path></g><path d="{{t.b.art}}" fill="rgba(0,0,0,0.5)" transform="translate(0.5 0.6)"></path><path d="{{t.b.art}}" fill="{{t.b.inkUrl}}"></path><text class="bh" x="32" y="36" fill="{{t.b.inkUrl}}">{{t.b.hid}}</text><text class="bl" x="32" y="23.5" fill="{{t.b.inkUrl}}">{{t.b.lbl}}</text><text class="bg" x="32" y="34" fill="{{t.b.inkUrl}}">{{t.b.glyph}}</text><text class="bt" x="32.4" y="{{t.b.stampY}}" fill="rgba(0,0,0,0.55)" transform="translate(0 0.6)">{{t.b.short}}</text><text class="bt" x="32" y="{{t.b.stampY}}" fill="{{t.b.inkUrl}}">{{t.b.short}}</text></svg>
        <div style="margin-top: 2px; font-size: 10px; font-weight: 700; letter-spacing: 0.8px; color: #8E8E93; text-transform: uppercase; line-height: 1.3;">{{t.track}}</div>
        <div style="font-size: 15px; font-weight: 800; line-height: 1.2;">{{t.b.title}}</div>
        <div style="font-size: 12px; color: #8E8E93;">{{t.earned}}</div>
      </button>
    </sc-for>
  </div>
  <div style="margin: 18px 16px 0; font-size: 12px; color: #8E8E93; line-height: 1.4;">Ride distance appears after your first ride.</div>

  <div style="margin: 26px 16px 10px; display: flex; justify-content: space-between; align-items: baseline;">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700;">Feats</h2>
    <span style="font-size: 13px; color: #8E8E93;">2 of 8</span>
  </div>
  <div style="margin: 0 16px; background: #1C1C1E; border-radius: 16px; padding: 12px 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px 4px;">
    <sc-for list="{{feats}}" as="f" hint-placeholder-count="8">
      <button class="plain" aria-label="{{f.label}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; text-align: center;">
        <svg viewBox="-8 -8 80 80" width="72" height="72" aria-hidden="true"><path d="{{f.b.crown}}" fill="#A3B18A"></path><path d="{{f.b.shape}}" fill="rgba(0,0,0,0.45)" transform="translate(0.8 1.6)"></path><path d="{{f.b.shape}}" fill="none" stroke="rgba(0,0,0,0.55)" style="stroke-width: 4.4; stroke-linejoin: round;"></path><path class="bs" d="{{f.b.shape}}" fill="{{f.b.fillUrl}}" stroke="{{f.b.rimUrl}}"></path><path d="{{f.b.shape}}" fill="url(#spec)"></path><path d="{{f.b.shape}}" fill="url(#gloss)"></path><path d="{{f.b.veins}}" fill="none" stroke="#A39D8E" style="stroke-width: 0.6; opacity: 0.6;"></path><path d="{{f.b.band}}" fill="none" stroke="{{f.b.rimUrl}}" style="stroke-width: {{f.b.bandW}}; stroke-dasharray: {{f.b.bandDash}};"></path><path class="bx" d="{{f.b.extra}}" stroke="{{f.b.rimUrl}}"></path><path d="{{f.b.detail}}" fill="none" stroke="rgba(0,0,0,0.5)" transform="translate(0.35 0.45)" style="stroke-width: 0.85; stroke-linecap: round;"></path><path d="{{f.b.detail}}" fill="none" stroke="{{f.b.inkUrl}}" style="stroke-width: 0.85; stroke-linecap: round; opacity: 0.8;"></path><g transform="{{f.b.iconT}}"><path class="bi" d="{{f.b.icon}}" stroke="rgba(0,0,0,0.55)" transform="translate(0.6 0.8)"></path><path class="bi" d="{{f.b.icon}}" stroke="rgba(255,255,255,0.3)" transform="translate(-0.4 -0.5)"></path><path class="bi" d="{{f.b.icon}}" stroke="{{f.b.iconUrl}}"></path></g><path d="{{f.b.art}}" fill="rgba(0,0,0,0.5)" transform="translate(0.5 0.6)"></path><path d="{{f.b.art}}" fill="{{f.b.inkUrl}}"></path><text class="bh" x="32" y="36" fill="{{f.b.inkUrl}}">{{f.b.hid}}</text><text class="bl" x="32" y="23.5" fill="{{f.b.inkUrl}}">{{f.b.lbl}}</text><text class="bg" x="32" y="34" fill="{{f.b.inkUrl}}">{{f.b.glyph}}</text><text class="bt" x="32.4" y="{{f.b.stampY}}" fill="rgba(0,0,0,0.55)" transform="translate(0 0.6)">{{f.b.short}}</text><text class="bt" x="32" y="{{f.b.stampY}}" fill="{{f.b.inkUrl}}">{{f.b.short}}</text></svg>
        <div style="font-size: 11px; font-weight: 600; color: #8E8E93; line-height: 1.2;">{{f.b.title}}</div>
      </button>
    </sc-for>
  </div>

  <div style="margin: 26px 16px 10px; display: flex; justify-content: space-between; align-items: baseline;">
    <h2 style="margin: 0; font-size: 17px; font-weight: 700;">Hidden</h2>
    <span style="font-size: 13px; color: #8E8E93;">1 found · 7 to find</span>
  </div>
  <div style="margin: 0 16px; background: #1C1C1E; border-radius: 16px; padding: 12px 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
    <sc-for list="{{hid}}" as="h" hint-placeholder-count="4">

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plates badge options</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.bs{stroke-width:3;stroke-linejoin:round}
.as{fill:none;stroke-linecap:round;stroke-linejoin:round}
.bt{font:800 9px Inter,sans-serif;text-anchor:middle}
.bl{font:800 5.4px Inter,sans-serif;text-anchor:middle;letter-spacing:.8px}
.bg{font:800 15px Inter,sans-serif;text-anchor:middle}
</style>
</helmet>
<div style="width: 1480px; height: 700px; box-sizing: border-box; background: #141416; color: #FFFFFF; font-family: Inter, -apple-system, sans-serif; padding: 44px 48px; display: flex; flex-direction: column; gap: 28px;">
  <div style="display: flex; flex-direction: column; gap: 8px;">
    <h1 style="margin: 0; font-size: 32px; font-weight: 800;">Plates: three options</h1>
    <p style="margin: 0; font-size: 15px; color: #8E8E93; max-width: 900px; line-height: 1.5;">Rungs run 1 to 4 plates (135 / 225 / 315 / 405 lbs), bronze, silver, gold, marble with the olive crown.</p>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px;">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="3">
      <section style="background: #1C1C1E; border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; border: 2px solid {{o.border}};">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 style="margin: 0; font-size: 18px; font-weight: 800;">{{o.title}}</h2>
          <span style="font-size: 13px; color: #8E8E93; line-height: 1.4;">{{o.note}}</span>
        </div>
        <sc-for list="{{o.rows}}" as="r" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 4px;">
            <span style="font-size: 12px; font-weight: 700; color: #8E8E93; letter-spacing: 1px;">{{r.lift}}</span>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px;">
              <sc-for list="{{r.badges}}" as="b" hint-placeholder-count="4">
                <div style="display: flex; justify-content: center;">
                  <svg viewBox="-10 -10 84 84" width="100" height="100" role="img" aria-label="{{b.label}}"><path d="{{b.crown}}" fill="#A3B18A"></path><path class="bs" d="{{b.shape}}" fill="{{b.fill}}" stroke="{{b.ring}}"></path><path d="{{b.shape}}" fill="none" stroke="{{b.ring}}" transform="translate(5.12 5.12) scale(0.84)" style="stroke-width: {{b.bandW}}; stroke-dasharray: {{b.bandDash}};"></path><path class="as" d="{{b.stroke}}" stroke="{{b.ink}}" style="stroke-width: {{b.strokeW}};"></path><path d="{{b.fillArt}}" fill="{{b.ink}}"></path><text class="bg" x="32" y="34" fill="{{b.ink}}">{{b.glyph}}</text><text class="bl" x="32" y="{{b.labelY}}" fill="{{b.ink}}">{{b.text}}</text><text class="bt" x="32" y="{{b.stampY}}" fill="{{b.ink}}">{{b.stamp}}</text></svg>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </div>
</div>
</x-dc>

  plate: 'M28.03 47.76 Q25.95 51.70 28.65 55.24 Q30.73 51.30 28.03 47.76 Z M28.03 47.76 Q23.64 48.49 22.46 52.78 Q26.85 52.05 28.03 47.76 Z M19.98 53.62 Q18.43 57.79 21.57 60.95 Q23.12 56.77 19.98 53.62 Z M19.98 53.62 Q15.72 54.91 15.10 59.32 Q19.37 58.03 19.98 53.62 Z M6.72 53.03 Q2.31 53.67 1.05 57.94 Q5.45 57.30 6.72 53.03 Z M6.72 53.03 Q3.54 49.91 -0.62 51.49 Q2.55 54.61 6.72 53.03 Z M1.81 41.14 Q-1.31 37.97 -5.50 39.48 Q-2.37 42.65 1.81 41.14 Z M1.81 41.14 Q2.44 36.73 -1.29 34.31 Q-1.92 38.72 1.81 41.14 Z M1.81 30.57 Q-1.25 27.33 -5.47 28.76 Q-2.41 31.99 1.81 30.57 Z M1.81 30.57 Q2.53 26.18 -1.15 23.68 Q-1.88 28.07 1.81 30.57 Z M1.84 20.10 Q-0.79 16.51 -5.15 17.39 Q-2.53 20.98 1.84 20.10 Z M1.84 20.10 Q3.11 15.83 -0.23 12.89 Q-1.50 17.16 1.84 20.10 Z M9.70 9.49 Q11.79 5.55 9.09 2.01 Q7.01 5.95 9.70 9.49 Z M9.70 9.49 Q14.10 8.77 15.29 4.48 Q10.89 5.20 9.70 9.49 Z M37.87 48.59 Q34.39 51.38 35.47 55.70 Q38.94 52.91 37.87 48.59 Z M37.87 48.59 Q37.98 53.04 42.07 54.80 Q41.96 50.35 37.87 48.59 Z M47.46 54.83 Q45.22 58.67 47.76 62.32 Q50.01 58.48 47.46 54.83 Z M47.46 54.83 Q49.16 58.94 53.61 59.12 Q51.91 55.01 47.46 54.83 Z M60.07 50.25 Q62.71 53.84 67.07 52.95 Q64.43 49.36 60.07 50.25 Z M60.07 50.25 Q64.52 50.32 66.45 46.31 Q62.00 46.24 60.07 50.25 Z M62.20 38.21 Q66.42 39.63 69.47 36.39 Q65.25 34.97 62.20 38.21 Z M62.20 38.21 Q65.88 35.71 65.15 31.32 Q61.47 33.82 62.20 38.21 Z M62.19 27.71 Q66.41 29.13 69.47 25.89 Q65.24 24.47 62.19 27.71 Z M62.19 27.71 Q65.87 25.21 65.14 20.82 Q61.46 23.32 62.19 27.71 Z M61.31 16.08 Q65.76 15.80 67.36 11.65 Q62.92 11.93 61.31 16.08 Z M61.31 16.08 Q63.78 12.38 61.44 8.59 Q58.98 12.29 61.31 16.08 Z M49.97 8.87 Q51.30 4.62 48.00 1.63 Q46.67 5.88 49.97 8.87 Z M49.97 8.87 Q47.39 5.24 43.01 6.06 Q45.59 9.69 49.97 8.87 Z'

const SH = {
  met1: 'M7 12 H57 A5 5 0 0 0 62 17 V47 A5 5 0 0 0 57 52 H7 A5 5 0 0 0 2 47 V17 A5 5 0 0 0 7 12 Z',
  met2: 'M10 7 H54 V57 H10 Z',
  plate: 'M5 21 C5 11 17 9 23 17 C27 21 37 21 41 17 C47 9 59 11 59 21 V43 C59 53 47 55 41 47 C37 43 27 43 23 47 C17 55 5 53 5 43 Z'
};
const BAND = { bronze: [0, 'none'], silver: [1.6, '2 2'], gold: [3, '3 1.5'], marble: [3, '3 1.5'] };
const MT = {
  bronze: { ring: '#C98A5A', fill: '#3A2618', icon: '#E7B48A' },
  silver: { ring: '#C7CDD6', fill: '#2A2E35', icon: '#E6EAF0' },
  gold: { ring: '#E8C25A', fill: '#3A3015', icon: '#F6DE8E' },
  marble: { ring: '#F2EEE4', fill: '#4A4436', icon: '#FFFFFF' }
};
const RUNG = ['bronze', 'silver', 'gold', 'marble'];
const WEIGHTS = ['135', '225', '315', '405'];
const LIFTS = [['B', 'BENCH', 'Bench'], ['S', 'SQUAT', 'Squat'], ['D', 'DEADLIFT', 'Deadlift']];
function f(n) { return n.toFixed(2); }
function rect(x, y, w, h) { return 'M' + f(x) + ' ' + f(y) + ' h' + f(w) + ' v' + f(h) + ' h' + f(-w) + ' Z '; }
function disc(cx, cy, r) { return 'M' + f(cx) + ' ' + f(cy - r) + ' a' + r + ' ' + r + ' 0 1 0 .01 0 Z '; }
// Side view of a bar loaded with n plates a side. Sized so four plates a side stay inside the
// plaque's key band (inner edge x 6.8 to 57.2), centred on x 32.
function barbell(n, y, plateH) {
  let fill = rect(22.4, y - 3, 1.6, 6) + rect(40, y - 3, 1.6, 6);
  for (let k = 0; k < n; k++) {
    fill += rect(22.4 - 2.8 * (k + 1) + 0.3, y - plateH / 2, 2.2, plateH);
    fill += rect(41.6 + 2.8 * k + 0.3, y - plateH / 2, 2.2, plateH);
  }
  return { stroke: 'M10 ' + y + ' H54', fill: fill };
}
// Black-figure lifters, drawn as thick strokes plus a solid head, in badge coordinates
const FIGURES = {
  B: { stroke: 'M16 39 H44 M19 39 V43 M41 39 V43 M22 35 H35 M35 35 L40 35 L43 43 M24 34 V24 M30 34 V24 M14 23 H40', heads: [[18.5, 34, 2.8]], plates: [[13, 23], [41, 23]] },
  S: { stroke: 'M31 20 L29 30 M29 30 L37 32 M37 32 L35 41 M29 30 L26 41 M18 20 H46 M31 21 L25 20 M31 21 L38 20 M22 42 H40', heads: [[32, 15.5, 2.8]], plates: [[17, 20], [47, 20]] },
  D: { stroke: 'M32 18 V30 M32 30 L29 42 M32 30 L35 42 M32 20 L28 33 M32 20 L36 33 M16 34 H48 M24 43 H40', heads: [[32, 13.5, 2.8]], plates: [[15, 34], [49, 34]] }
};
function pips(n) {
  let fillD = '', stroke = '';
  for (let k = 0; k < 4; k++) {
    const x = 24.5 + k * 5;
    if (k < n) fillD += disc(x, 48.5, 1.7); else stroke += 'M' + f(x) + ' 46.8 a1.7 1.7 0 1 0 .01 0 Z ';
  }
  return { fill: fillD, stroke: stroke };
}
function base(key, i) {
  const metal = RUNG[i], m = MT[metal];
  return { shape: SH[key], ring: m.ring, fill: m.fill, ink: m.icon, bandW: BAND[metal][0], bandDash: BAND[metal][1], crown: metal === 'marble' ? CROWNS[key] : '', glyph: '', text: '', stamp: '', labelY: 47, stampY: 52, stroke: '', fillArt: '', strokeW: 2 };
}
class Component extends DCLogic {
  renderVals() {
    const opt1 = LIFTS.map((l) => ({
      lift: l[2].toUpperCase(),
      badges: WEIGHTS.map((w, i) => {
        const bb = barbell(i + 1, 31, 12);
        return Object.assign(base('met1', i), { stroke: bb.stroke, fillArt: bb.fill, strokeW: 1.6, text: l[1], labelY: 21.5, stamp: w, stampY: 46.5, label: (i + 1) + ' Plate ' + l[2] });
      })
    }));
    const opt2 = LIFTS.map((l) => ({
      lift: l[2].toUpperCase(),
      badges: WEIGHTS.map((w, i) => {
        const fig = FIGURES[l[0]], p = pips(i + 1);
        let fillD = p.fill;
        fig.heads.forEach((h) => { fillD += disc(h[0], h[1], h[2]); });
        fig.plates.forEach((pl) => { fillD += rect(pl[0] - 1.3, pl[1] - 4.5, 2.6, 9); });
        return Object.assign(base('met2', i), { stroke: fig.stroke + ' ' + p.stroke, fillArt: fillD, strokeW: 2.6, label: (i + 1) + ' Plate ' + l[2] });
      })
    }));
    const now = LIFTS.map((l) => ({
      lift: l[2].toUpperCase(),
      badges: WEIGHTS.map((w, i) => Object.assign(base('plate', i), { stroke: 'M15 23 C10 27 10 37 15 41 M49 23 C54 27 54 37 49 41', strokeW: 2.4, glyph: l[0], stamp: w, stampY: 41.5, label: (i + 1) + ' Plate ' + l[2] }))
    }));
    return {
      options: [
        { title: 'Option 1 · Loaded barbell on a pinax', note: 'A Greek votive plaque with notched corners. The bar carries 1 to 4 plates a side inside the rim, so the rung reads at a glance.', rows: opt1, border: '#30D158' },
        { title: 'Option 2 · Black-figure lifters', note: 'One panel for every lift; a pottery-style lifter names the lift, pips along the base count the plates.', rows: opt2, border: '#38383A' },
        { title: 'Now · Halteres', note: 'Current design, for comparison: lift initial and weight stamp.', rows: now, border: '#38383A' }
      ]
    };
  }
}
